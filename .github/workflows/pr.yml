# Build + unit tests on every pull request (any target branch).
# SqlServer/Cosmos [AvailableFact] E2E soft-skip when those DBs are unreachable.
# Publish workflows re-run tests before releasing from main/prod.
name: PR

on:
  pull_request:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore DataQL.sln

      - name: Build
        run: dotnet build DataQL.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test DataQL.sln -c Release --no-build --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Test report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Unit tests
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          fail-on-error: true

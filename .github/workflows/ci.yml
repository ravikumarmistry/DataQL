# Phase 1: build + unit tests (and Sqlite in-memory E2E). No Docker.
# SqlServer/Cosmos [AvailableFact] E2E soft-skip when those DBs are unreachable.
# Phase 2 will require real DBs before NuGet publish.
name: CI

on:
  push:
    branches:
      - main
      - prod
  pull_request:
    branches:
      - main
      - prod

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore DataQL.sln

      - name: Build
        run: dotnet build DataQL.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test DataQL.sln -c Release --no-build --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Test report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Unit tests
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          fail-on-error: true

# Publishes prerelease packages from main: {VersionPrefix}-preview.{run_number}
# Requires nuget.org Trusted Publishing policy for workflow file: publish-preview.yml
# Optional GitHub Environment: nuget-preview (restrict deployments to branch main)
name: Publish preview

on:
  push:
    branches:
      - main

concurrency:
  group: publish-preview
  cancel-in-progress: false

jobs:
  publish:
    name: Pack and publish preview
    runs-on: ubuntu-latest
    environment: nuget-preview
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: >
          ./build/Resolve-PackageVersion.ps1
          -Kind preview
          -PreviewNumber '${{ github.run_number }}'
          -EnforceBranch

      - name: Restore
        run: dotnet restore DataQL.sln

      - name: Build
        run: >
          dotnet build DataQL.sln -c Release --no-restore
          -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: >
          dotnet test DataQL.sln -c Release --no-build --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Pack
        run: >
          dotnet pack DataQL.sln -c Release --no-build -o artifacts
          -p:Version=${{ steps.version.outputs.version }}

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Tag release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping."
          else
            git tag -a "$TAG" -m "Preview $VERSION"
            git push origin "$TAG"
          fi

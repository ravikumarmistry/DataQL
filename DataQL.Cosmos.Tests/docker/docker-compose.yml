name: dataql-cosmos-tests

services:
  dataql-cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    container_name: dataql-cosmos-tests
    environment:
      PROTOCOL: https
    ports:
      - "${COSMOS_PORT:-8081}:8081"
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://localhost:8081/_explorer/emulator.pem || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
